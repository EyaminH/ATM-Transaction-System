{% extends "base.html" %}
{% block title %}Transfer Funds — ATM System{% endblock %}

{% block content %}
<div class="page-header fade-up">
    <h1>🔄 Transfer Funds</h1>
    <p>Transfer money securely to another account</p>
</div>

<div class="card fade-up-1">
    <form method="POST" action="{{ url_for('transaction.transfer') }}" class="transaction-form" id="transfer-form">
        <div class="form-group">
            <label for="account_id">From Account</label>
            <select name="account_id" id="account_id" class="form-control" required>
                {% for account in accounts %}
                <option value="{{ account.id }}">
                    {{ account.account_type | title }} — {{ account.account_number }} (৳{{ "%.2f"|format(account.balance) }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="target_account">Recipient Account Number</label>
            <input type="text" name="target_account" id="target_account" class="form-control mono"
                   placeholder="e.g. ACC-1002" required autocomplete="off">
            <small style="color:var(--text-muted);margin-top:0.35rem;display:block;">
                Enter the exact account number of the recipient.
            </small>
        </div>

        <div class="amount-display">
            <div class="currency">৳</div>
            <input type="number" name="amount" id="amount" placeholder="0.00"
                   min="10" step="10" required>
        </div>

        <div class="action-grid" style="margin-bottom:1.5rem;">
            <div class="action-card" onclick="setAmount(500)" style="cursor:pointer;">৳500</div>
            <div class="action-card" onclick="setAmount(1000)" style="cursor:pointer;">৳1,000</div>
            <div class="action-card" onclick="setAmount(5000)" style="cursor:pointer;">৳5,000</div>
            <div class="action-card" onclick="setAmount(10000)" style="cursor:pointer;">৳10,000</div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-transfer">
            🔄 Transfer Now
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
function setAmount(val) {
    document.getElementById('amount').value = val;
}
</script>
{% endblock %}
